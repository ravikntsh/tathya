<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tathya: India's development record</title>
  <meta name="description" content="State-wise development data for India, with the official source behind every number.">
  <meta property="og:title" content="Tathya: India's development record">
  <meta property="og:description" content="State-wise development data for India, with the official source behind every number.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">त</span>
      <div>
        <strong>Tathya</strong>
        <span class="tagline" data-i18n="tagline"></span>
      </div>
    </div>
    <div class="top-actions">
      <button id="lang" class="pill" type="button" aria-label="Switch language">हिं</button>
      <button id="theme" class="pill" type="button" aria-label="Switch colour theme">◐</button>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" aria-labelledby="rail-h">
      <h2 id="rail-h" class="rail-h" data-i18n="issues"></h2>
      <ul id="issues"></ul>
    </nav>

    <main id="main">
      <section class="intro">
        <h1 data-i18n="trackerTitle"></h1>
        <p data-i18n="trackerIntro"></p>
      </section>

      <section class="controls" aria-label="Controls">
        <div class="field">
          <span class="label" id="ind-label" data-i18n="indicator"></span>
          <div id="indicators" class="chips" role="radiogroup" aria-labelledby="ind-label"></div>
        </div>
        <div class="field slider-field">
          <label class="label" for="round" data-i18n="round"></label>
          <input id="round" type="range" min="0" max="0" step="1" value="0">
          <div id="round-ticks" class="ticks"></div>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>

      <div class="grid">
        <section class="map-panel" aria-labelledby="map-h">
          <h2 id="map-h" class="vh">Map</h2>
          <p id="map-banner" class="banner" data-i18n="mapBanner" hidden></p>
          <div id="map" class="map-wrap"></div>
          <div id="legend" class="legend"></div>
          <p id="summary" class="summary"></p>
        </section>

        <aside class="side">
          <section id="card" class="fact-card" aria-live="polite"></section>

          <section class="panel">
            <h2 data-i18n="nationalTrend"></h2>
            <div id="trend"></div>
          </section>

          <section class="panel ranks">
            <div>
              <h2 data-i18n="top"></h2>
              <div id="top"></div>
            </div>
            <div>
              <h2 data-i18n="bottom"></h2>
              <div id="bottom"></div>
            </div>
          </section>

          <section class="panel">
            <h2 data-i18n="compare"></h2>
            <div class="compare-pick">
              <select id="cmp-a" aria-label="First state"></select>
              <select id="cmp-b" aria-label="Second state"></select>
            </div>
            <div id="compare"></div>
          </section>
        </aside>
      </div>

      <section class="panel table-panel">
        <button id="table-toggle" class="pill" type="button" aria-expanded="false" aria-controls="table"></button>
        <p id="ind-def" class="muted small"></p>
        <div id="table" class="table-wrap" hidden></div>
      </section>
    </main>
  </div>

  <footer class="foot">
    <p><span data-i18n="surveyNote"></span></p>
    <p>
      <a href="docs/corrections.md" data-i18n="corrections"></a> ·
      <a href="docs/methodology.md" data-i18n="methodology"></a> ·
      <span data-i18n="dataFrom"></span>: <span id="origin"></span> ·
      <a href="https://github.com/ravikntsh/tathya">GitHub</a>
    </p>
  </footer>
</body>
</html>
